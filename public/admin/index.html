<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị - Phào Chỉ Trang Trí</title>
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- Trang đăng nhập quản trị -->
<div id="login-page" class="login-page">
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-shield-alt"></i>
            <h1>Quản Trị Hệ Thống</h1>
            <p>Phào Chỉ Trang Trí</p>
        </div>
        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="login-username"><i class="fas fa-user"></i> Tên đăng nhập</label>
                <input type="text" id="login-username" name="username" required autocomplete="username" placeholder="Nhập tên đăng nhập">
            </div>
            <div class="form-group">
                <label for="login-password"><i class="fas fa-lock"></i> Mật khẩu</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="Nhập mật khẩu">
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility()">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Đăng Nhập
            </button>
            <div id="login-error" class="login-error" style="display:none;"></div>
        </form>
    </div>
</div>

<!-- Giao diện quản trị sau khi đăng nhập -->
<div id="admin-layout" class="admin-layout" style="display:none;">
    <!-- Thanh điều hướng bên -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-columns"></i> <span>Quản Trị</span></h2>
            <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-link active" data-page="dashboard">
                <i class="fas fa-tachometer-alt"></i> <span>Dashboard</span>
            </a>
            <a href="#products" class="nav-link" data-page="products">
                <i class="fas fa-box-open"></i> <span>Sản Phẩm</span>
            </a>
            <a href="#categories" class="nav-link" data-page="categories">
                <i class="fas fa-tags"></i> <span>Danh Mục</span>
            </a>
            <a href="#hero-slides" class="nav-link" data-page="hero-slides">
                <i class="fas fa-images"></i> <span>Hero Slides</span>
            </a>
            <a href="#contacts" class="nav-link" data-page="contacts">
                <i class="fas fa-envelope"></i> <span>Liên Hệ</span>
                <span id="unread-badge" class="nav-badge" style="display:none;">0</span>
            </a>
            <a href="#upload-history" class="nav-link" data-page="upload-history">
                <i class="fas fa-images"></i> <span>Lịch Sử Ảnh</span>
            </a>
            <a href="#admin-history" class="nav-link" data-page="admin-history">
                <i class="fas fa-clock-rotate-left"></i> <span>Lịch Sử Admin</span>
            </a>
            <a href="#settings" class="nav-link" data-page="settings">
                <i class="fas fa-cog"></i> <span>Cài Đặt</span>
            </a>
            <div class="nav-divider"></div>
            <a href="/" class="nav-link">
                <i class="fas fa-home"></i> <span>Về Trang Chủ</span>
            </a>
            <a href="#" class="nav-link" onclick="handleLogout(event)">
                <i class="fas fa-sign-out-alt"></i> <span>Đăng Xuất</span>
            </a>
        </nav>
    </aside>

    <!-- Khu vực nội dung chính -->
    <div class="main-wrapper">
        <!-- Thanh tiêu đề và thông tin tài khoản -->
        <header class="topbar">
            <button class="topbar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="topbar-title" id="topbar-title">Dashboard</div>
            <div class="topbar-right">
                <span class="admin-name" id="admin-name">
                    <i class="fas fa-user-circle"></i> Admin
                </span>
                <button class="btn btn-sm btn-outline" onclick="handleLogout(event)">
                    <i class="fas fa-sign-out-alt"></i> Đăng Xuất
                </button>
            </div>
        </header>

        <!-- Nội dung trang được JavaScript hiển thị tại đây -->
        <main class="main-content" id="main-content">
        </main>
    </div>
</div>

<!-- Hộp thoại dùng chung; nội dung được JavaScript tạo động -->
<div id="modal-overlay" class="modal-overlay" style="display:none;" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3 id="modal-title">Modal</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modal-body">
        </div>
    </div>
</div>

<!-- Hộp thoại xác nhận thao tác -->
<div id="confirm-overlay" class="modal-overlay confirm-overlay" style="display:none;">
    <div class="confirm-dialog">
        <div class="confirm-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <h3 id="confirm-title">Xác nhận</h3>
        <p id="confirm-message">Bạn có chắc chắn muốn thực hiện?</p>
        <div class="confirm-actions">
            <button class="btn btn-secondary" id="confirm-cancel">Hủy</button>
            <button class="btn btn-danger" id="confirm-ok">Xác nhận</button>
        </div>
    </div>
</div>

<!-- Vùng hiển thị thông báo ngắn -->
<div id="toast-container" class="toast-container"></div>

<!-- Lớp phủ báo trạng thái đang tải -->
<div id="loading-overlay" class="loading-overlay" style="display:none;">
    <div class="spinner"></div>
</div>

<!-- Các mẫu giao diện trang quản trị; JavaScript sao chép mẫu khi điều hướng -->

<!-- Trang tổng quan -->
<template id="tpl-dashboard">
    <div class="page-header">
        <h1><i class="fas fa-tachometer-alt"></i> Dashboard</h1>
    </div>
    <div class="stats-grid">
        <div class="stat-card stat-products">
            <div class="stat-icon"><i class="fas fa-box-open"></i></div>
            <div class="stat-info">
                <h3 id="stat-products-count">0</h3>
                <p>Sản Phẩm</p>
            </div>
        </div>
        <div class="stat-card stat-categories">
            <div class="stat-icon"><i class="fas fa-tags"></i></div>
            <div class="stat-info">
                <h3 id="stat-categories-count">0</h3>
                <p>Danh Mục</p>
            </div>
        </div>
        <div class="stat-card stat-messages">
            <div class="stat-icon"><i class="fas fa-envelope"></i></div>
            <div class="stat-info">
                <h3 id="stat-unread-count">0</h3>
                <p>Tin Nhắn Chưa Đọc</p>
            </div>
        </div>
        <div class="stat-card stat-slides">
            <div class="stat-icon"><i class="fas fa-images"></i></div>
            <div class="stat-info">
                <h3 id="stat-slides-count">0</h3>
                <p>Hero Slides</p>
            </div>
        </div>
    </div>
    <div class="dashboard-section">
        <h2><i class="fas fa-clock"></i> Liên Hệ Gần Đây</h2>
        <div id="recent-contacts" class="recent-contacts">
            <p class="text-muted">Đang tải...</p>
        </div>
    </div>
</template>

<!-- Trang quản lý sản phẩm -->
<template id="tpl-products">
    <div class="page-header">
        <h1><i class="fas fa-box-open"></i> Quản Lý Sản Phẩm</h1>
        <button class="btn btn-primary" onclick="openProductForm()">
            <i class="fas fa-plus"></i> Thêm Sản Phẩm
        </button>
    </div>
    <div class="table-toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="product-search" placeholder="Tìm kiếm sản phẩm..." oninput="filterProducts()">
        </div>
        <div class="table-info">
            <span id="product-count-info">0 sản phẩm</span>
        </div>
    </div>
    <div class="table-responsive">
        <table class="data-table" id="products-table">
            <thead>
                <tr>
                    <th class="sortable" onclick="sortTable('products', 'name')">Hình ảnh</th>
                    <th class="sortable" onclick="sortTable('products', 'name')">Tên sản phẩm <i class="fas fa-sort"></i></th>
                    <th class="sortable" onclick="sortTable('products', 'category')">Danh mục <i class="fas fa-sort"></i></th>
                    <th class="sortable" onclick="sortTable('products', 'price')">Giá <i class="fas fa-sort"></i></th>
                    <th>Nổi bật</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="products-tbody">
                <tr><td colspan="6" class="text-center text-muted">Đang tải...</td></tr>
            </tbody>
        </table>
    </div>
</template>

<!-- Trang quản lý danh mục -->
<template id="tpl-categories">
    <div class="page-header">
        <h1><i class="fas fa-tags"></i> Quản Lý Danh Mục</h1>
        <button class="btn btn-primary" onclick="openCategoryForm()">
            <i class="fas fa-plus"></i> Thêm Danh Mục
        </button>
    </div>
    <div class="table-toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="category-search" placeholder="Tìm kiếm danh mục..." oninput="filterCategories()">
        </div>
    </div>
    <div class="table-responsive">
        <table class="data-table" id="categories-table">
            <thead>
                <tr>
                    <th class="sortable" onclick="sortTable('categories', 'name')">Tên danh mục <i class="fas fa-sort"></i></th>
                    <th>Mô tả</th>
                    <th>Số sản phẩm</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="categories-tbody">
                <tr><td colspan="4" class="text-center text-muted">Đang tải...</td></tr>
            </tbody>
        </table>
    </div>
</template>

<!-- Trang quản lý ảnh trình chiếu đầu trang -->
<template id="tpl-hero-slides">
    <div class="page-header">
        <h1><i class="fas fa-images"></i> Quản Lý Hero Slides</h1>
        <button class="btn btn-primary" onclick="openSlideForm()">
            <i class="fas fa-plus"></i> Thêm Slide
        </button>
    </div>
    <div id="slides-grid" class="slides-grid">
        <p class="text-muted">Đang tải...</p>
    </div>
</template>

<!-- Trang quản lý tin nhắn liên hệ -->
<template id="tpl-contacts">
    <div class="page-header">
        <h1><i class="fas fa-envelope"></i> Tin Nhắn Liên Hệ</h1>
    </div>
    <div class="table-toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="contact-search" placeholder="Tìm kiếm tin nhắn..." oninput="filterContacts()">
        </div>
        <div class="table-info">
            <span id="contact-count-info">0 tin nhắn</span>
        </div>
    </div>
    <div class="table-responsive">
        <table class="data-table" id="contacts-table">
            <thead>
                <tr>
                    <th></th>
                    <th class="sortable" onclick="sortTable('contacts', 'name')">Họ tên <i class="fas fa-sort"></i></th>
                    <th>Email</th>
                    <th>Điện thoại</th>
                    <th>Nội dung</th>
                    <th class="sortable" onclick="sortTable('contacts', 'createdAt')">Ngày <i class="fas fa-sort"></i></th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="contacts-tbody">
                <tr><td colspan="7" class="text-center text-muted">Đang tải...</td></tr>
            </tbody>
        </table>
    </div>
</template>

<!-- Trang lịch sử ảnh đã tải lên -->
<template id="tpl-upload-history">
    <div class="page-header">
        <h1><i class="fas fa-images"></i> Lịch Sử Ảnh</h1>
        <button type="button" class="btn btn-outline" onclick="loadUploadHistory()">
            <i class="fas fa-rotate"></i> Tải lại
        </button>
    </div>
    <div class="form-card">
        <p class="form-hint">Ảnh đang được sản phẩm, danh mục, slide hoặc cài đặt sử dụng sẽ được khóa xóa. Xóa ảnh sẽ gỡ tệp khỏi máy chủ và không thể hoàn tác.</p>
        <div id="upload-history-summary" class="upload-history-summary"></div>
        <div id="upload-history-list" class="upload-history-grid">
            <p class="text-muted">Đang tải lịch sử ảnh...</p>
        </div>
    </div>
</template>

<!-- Trang lịch sử thao tác quản trị -->
<template id="tpl-admin-history">
    <div class="page-header">
        <h1><i class="fas fa-clock-rotate-left"></i> Lịch Sử Thay Đổi Admin</h1>
        <button type="button" class="btn btn-outline" onclick="loadAdminHistory()">
            <i class="fas fa-rotate"></i> Tải lại
        </button>
    </div>
    <div class="table-responsive">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Thời gian</th>
                    <th>Admin</th>
                    <th>Thao tác</th>
                    <th>Khu vực</th>
                    <th>Chi tiết</th>
                </tr>
            </thead>
            <tbody id="admin-history-tbody">
                <tr><td colspan="5" class="text-center text-muted">Đang tải lịch sử...</td></tr>
            </tbody>
        </table>
    </div>
</template>

<!-- Trang cài đặt nội dung và thông tin website -->
<template id="tpl-settings">
    <div class="page-header">
        <h1><i class="fas fa-cog"></i> Cài Đặt Website</h1>
    </div>
    <form id="settings-form" class="settings-form" onsubmit="saveSettings(event)">
        <div class="form-card">
            <h3><i class="fas fa-building"></i> Thông Tin Công Ty</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="setting-companyName">Tên công ty</label>
                    <input type="text" id="setting-companyName" name="companyName" required>
                </div>
            </div>
            <div class="form-group">
                <label for="setting-logo-file">Logo công ty</label>
                <div class="image-upload-area" onclick="document.getElementById('setting-logo-file').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Click để chọn logo (tối đa 5MB)</p>
                </div>
                <input type="file" id="setting-logo-file" accept="image/*" style="display:none" onchange="previewImage(this, 'setting-logo-preview', 'setting-logo-url')">
                <input type="hidden" id="setting-logo-url" name="logo">
                <div id="setting-logo-preview" class="mt-1"></div>
            </div>
            <div class="form-group">
                <label>Liên kết mạng xã hội ở chân trang</label>
                <p class="form-hint">Nhập địa chỉ website cho từng biểu tượng. Mục không có đường dẫn sẽ không hiển thị ngoài trang chính.</p>
                <input type="hidden" id="setting-social-links-data" name="socialLinks">
                <div id="setting-social-links-list" class="settings-social-links-list"></div>
                <button type="button" class="btn btn-outline mt-2" onclick="addSocialLink()">
                    <i class="fas fa-plus"></i> Thêm liên kết
                </button>
            </div>
            <div class="form-row two-col">
                <div class="form-group">
                    <label for="setting-phone">Số điện thoại</label>
                    <input type="text" id="setting-phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="setting-email">Email</label>
                    <input type="email" id="setting-email" name="email">
                </div>
            </div>
            <div class="form-group">
                <label for="setting-address">Địa chỉ</label>
                <input type="text" id="setting-address" name="address">
            </div>
            <div class="form-group">
                <label for="setting-about-title">Nhãn phần giới thiệu</label>
                <input type="text" id="setting-about-title" name="aboutTitle" placeholder="Về Chúng Tôi">
            </div>
            <div class="form-group">
                <label for="setting-about-section-title">Tiêu đề phần giới thiệu</label>
                <input type="text" id="setting-about-section-title" name="aboutTitleText" placeholder="Đơn Vị Hàng Đầu Về Phào Chỉ Trang Trí">
            </div>
            <div class="form-group">
                <label for="setting-about-heading">Tiêu đề nội dung (để trống sẽ dùng tên công ty)</label>
                <input type="text" id="setting-about-heading" name="aboutHeading" placeholder="Tên công ty – Kiến Tạo Vẻ Đẹp Cho Mọi Công Trình">
            </div>
            <div class="form-group">
                <label for="setting-about">Đoạn giới thiệu thứ nhất</label>
                <textarea id="setting-about" name="about" rows="5" placeholder="Mô tả ngắn về công ty..."></textarea>
            </div>
            <div class="form-group">
                <label for="setting-about-secondary">Đoạn giới thiệu thứ hai</label>
                <textarea id="setting-about-secondary" name="aboutTextSecondary" rows="5" placeholder="Thông tin thêm về sản phẩm và dịch vụ..."></textarea>
            </div>
            <div class="form-row two-col">
                <div class="form-group">
                    <label for="setting-about-badge-number">Số trên nhãn ảnh</label>
                    <input type="text" id="setting-about-badge-number" name="aboutBadgeNumber" placeholder="15+">
                </div>
                <div class="form-group">
                    <label for="setting-about-badge-text">Nội dung nhãn ảnh</label>
                    <input type="text" id="setting-about-badge-text" name="aboutBadgeText" placeholder="Năm Kinh Nghiệm">
                </div>
            </div>
            <div class="form-group">
                <label for="setting-about-image-file">Ảnh phần giới thiệu</label>
                <div class="image-upload-area" onclick="document.getElementById('setting-about-image-file').click()">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Click để chọn ảnh (tối đa 5MB)</p>
                </div>
                <input type="file" id="setting-about-image-file" accept="image/*" style="display:none" onchange="previewImage(this, 'setting-about-image-preview', 'setting-about-image-url')">
                <input type="hidden" id="setting-about-image-url" name="aboutImage">
                <div id="setting-about-image-preview" class="mt-1"></div>
            </div>
        </div>
        <div class="form-card">
            <h3><i class="fas fa-chart-bar"></i> Số Liệu Giới Thiệu</h3>
            <input type="hidden" id="setting-about-stats-data" name="aboutStats">
            <div id="setting-about-stats-list" class="settings-about-stats-list"></div>
            <button type="button" class="btn btn-outline mt-2" onclick="addAboutStat()">
                <i class="fas fa-plus"></i> Thêm số liệu
            </button>
        </div>
        <div class="form-card">
            <h3><i class="fas fa-award"></i> Cam Kết Của Chúng Tôi</h3>
            <div class="form-group">
                <label for="setting-features-title">Tiêu đề phần cam kết</label>
                <input type="text" id="setting-features-title" name="featuresTitle">
            </div>
            <input type="hidden" id="setting-features-data" name="features">
            <div id="setting-features-list" class="settings-features-list"></div>
            <button type="button" class="btn btn-outline mt-2" onclick="addFeatureSetting()">
                <i class="fas fa-plus"></i> Thêm cam kết
            </button>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-save"></i> Lưu Cài Đặt
            </button>
        </div>
    </form>
</template>

<script src="/js/admin.js"></script>
</body>
</html>
