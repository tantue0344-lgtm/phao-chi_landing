services:
  postgres:
    image: postgres:16-alpine
    container_name: phao_chi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PGPASSWORD:?Set PGPASSWORD in the local .env file}"
      POSTGRES_DB: phao_chi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
